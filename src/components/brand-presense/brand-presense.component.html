<section class="brand-presence-section" id="brandPresence">

  <div class="paper-overlay"></div>

  <div class="container">

    <div class="section-title">
      <h2 class="text-yellow">Brand Presence</h2>
    </div>

    <div class="search-box">

      <i class="bi bi-search"></i>

      <input
        type="text"
        placeholder="Search by city or outlet..."
        [(ngModel)]="searchText"
        (input)="filterLocations()">

    </div>

    <p class="result-count">
      {{filteredLocations.length}} Outlets Found
    </p>

    <div class="outlet-grid">

      <div
        class="outlet-card"
        *ngFor="let outlet of displayedLocations">

        <div class="city-badge">
          {{outlet.city}}
        </div>

        <h4>
          <img src="./assets/img/locations/pin.png">
          {{outlet.name}}
        </h4>

        <a
          [href]="outlet.link"
          target="_blank"
          class="view-map">

          View on Google Maps
          <i class="bi bi-arrow-up-right"></i>

        </a>

      </div>

    </div>

    <div class="text-center mt-5"
      *ngIf="!searchText && filteredLocations.length>displayCount">

      <button
        class="btn-load"
        (click)="loadMore()">

        Load More

      </button>

    </div>

  </div>

</section>
