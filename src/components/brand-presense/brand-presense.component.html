<section class="brand-presence-section" id="brandPresence">

  <div class="paper-overlay"></div>

  <div class="container">
    <div class="section-title">

      <div class="section-eyebrow">
        <span></span>
        OUR PRESENCE
        <span></span>
      </div>

      <h3>
        Brand <strong>Presence</strong>
      </h3>

      <div class="section-line"></div>

    </div>

    <div class="search-box">

      <i class="search-icon bi bi-search"></i>

      <input type="text" placeholder="Search by city or outlet..." [(ngModel)]="searchText" (input)="filterLocations()">

      <button type="button" class="btn-near-me" (click)="findLocationNearMe()" [disabled]="isFindingLocation">
        <i class="bi bi-geo-alt-fill"></i>
        <span>{{ isFindingLocation ? 'Finding location...' : 'Find location near me' }}</span>
        <i class="bi bi-arrow-right"></i>
      </button>

      <p class="location-status" *ngIf="locationError" role="alert">{{ locationError }}</p>

    </div>

    <div class="outlet-grid">

      <div #outletCard class="outlet-card" *ngFor="let outlet of displayedLocations; let outletIndex = index"
        [class.outlet-card-visible]="visibleOutlets.has(outlet.name)"
        [style.--card-delay]="outletIndex * 70 + 'ms'">

        <div class="city-badge">
          {{outlet.city}}
        </div>

        <h4>
          <img src="./assets/img/locations/pin.png">
          {{outlet.name}}
        </h4>

        <a [href]="outlet.link" target="_blank" class="view-map">

          View on Google Maps
          <i class="bi bi-arrow-up-right"></i>

        </a>

      </div>

    </div>

    <div class="text-center mt-5" *ngIf="!searchText && filteredLocations.length>displayCount">

      <button class="btn-load" (click)="loadMore()">

        Load More

      </button>

    </div>

  </div>

</section>
