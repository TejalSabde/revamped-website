<div id="home">

  <!-- HERO -->
  <div
    [ngClass]="{
      'mobile-hero': isMobile,
      'hero-container': !isMobile
    }">

    <!-- SLIDER -->
    <div
      id="heroCarousel"
      class="carousel slide hero-slider"
      data-bs-ride="carousel"
      data-bs-interval="5000"
      data-bs-wrap="true"
      data-bs-pause="false">


      <!-- Images -->
      <div class="carousel-inner">

        <div
          *ngFor="let image of heroImages; let i = index"
          class="carousel-item"
          [class.active]="i === 0">

          <picture>

            <source
              media="(max-width: 768px)"
              [srcset]="image.mobile">

            <img
              [src]="image.desktop"
              class="d-block w-100 hero-image"
              alt="Shawarmaji">

          </picture>

        </div>

      </div>


      <!-- Controls -->
      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#heroCarousel"
        data-bs-slide="prev">

        <span class="carousel-control-prev-icon"></span>

      </button>

      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#heroCarousel"
        data-bs-slide="next">

        <span class="carousel-control-next-icon"></span>

      </button>

    </div>


    <!-- CONTENT OVER SLIDER -->
    <div
      [ngClass]="{
        'mobile-hero-content': isMobile,
        'hero-content': !isMobile
      }">

      <div
        class="fade-in-right"
        [ngClass]="{
          'desktop-hero-text hero-text': !isMobile
        }">

        <button
          class="brochure-btn"
          *ngIf="!isMobile"
          (click)="downloadBrochure()">

          Download Brochure

        </button>

      </div>

    </div>

  </div>


  <!-- PREMIUM FEATURES -->
  <section class="premium-features" *ngIf="!isMobile">

    <div class="features-container">

      <div class="feature-item">
        <div class="feature-icon">
          <i class="bi bi-feather"></i>
        </div>

        <div class="feature-content">
          <h3>Premium Ingredients</h3>
          <p>
            We use only the finest<br>
            and freshest ingredients.
          </p>
        </div>
      </div>


      <div class="feature-item">
        <div class="feature-icon">
          <i class="bi bi-fire"></i>
        </div>

        <div class="feature-content">
          <h3>Freshly Grilled</h3>
          <p>
            Grilled to perfection for<br>
            that authentic smoky flavor.
          </p>
        </div>
      </div>


      <div class="feature-item">
        <div class="feature-icon">
          <i class="bi bi-cone-striped"></i>
        </div>

        <div class="feature-content">
          <h3>Signature Flavors</h3>
          <p>
            Unique recipes crafted to<br>
            delight your taste buds.
          </p>
        </div>
      </div>


      <div class="feature-item">
        <div class="feature-icon">
          <i class="bi bi-shield-check"></i>
        </div>

        <div class="feature-content">
          <h3>Hygienic &amp; Safe</h3>
          <p>
            Highest standards of hygiene<br>
            for your safety.
          </p>
        </div>
      </div>

    </div>

  </section>


  <!-- MAIN CONTENT -->
  <div id="main">

    <app-menu></app-menu>
    <app-growth-story></app-growth-story>
    <app-brand-presense></app-brand-presense>
    <app-about-us></app-about-us>
    <app-team></app-team>

  </div>

</div>
