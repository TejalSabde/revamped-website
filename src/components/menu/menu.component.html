<section class="menu-container" id="menu">
  <div class="section-title" *ngIf="isMobile">

    <div class="section-eyebrow">
      <span></span>
      OUR MENU
      <span></span>
    </div>

    <h3>
      The <strong>Menu</strong>
    </h3>

    <div class="section-line"></div>

  </div>
  <!-- LEFT SIDEBAR -->
  <aside class="menu-sidebar">



    <ul class="menu-categories">
      <li *ngFor="let cat of categories" [class.active]="selectedCategory === cat" (click)="selectCategory(cat)">
        <span class="category-name">
          {{ cat }}
        </span>

        <span class="category-arrow">→</span>
      </li>
    </ul>

  </aside>


  <!-- RIGHT CONTENT -->
  <main class="menu-content">

    <!-- HEADING + FILTERS -->
    <div class="menu-heading">

      <div class="heading-content">

        <span class="menu-eyebrow">
          Our Signature Selection
        </span>

        <h2>
          {{ selectedCategory }}
        </h2>

        <div class="heading-line"></div>

      </div>


      <!-- VEG / NON VEG FILTER -->
      <div class="food-type-filter">

        <button type="button" [class.active]="selectedFoodType === 'all'" (click)="selectFoodType('all')">
          All
        </button>

        <button type="button" [class.active]="selectedFoodType === 'veg'" (click)="selectFoodType('veg')">
          <span class="food-type-icon veg-icon"></span>
          Veg
        </button>

        <button type="button" [class.active]="selectedFoodType === 'non-veg'" (click)="selectFoodType('non-veg')">
          <span class="food-type-icon nonveg-icon"></span>
          Non-Veg
        </button>

      </div>

    </div>


    <!-- FOOD GRID -->
    <div class="menu-grid">

      <div class="menu-item" *ngFor="let item of filteredItems">

        <article class="menu-card">

          <!-- IMAGE -->
          <div class="menu-image-wrapper">

            <img [src]="item.image" [alt]="item.name" loading="lazy" />

            <!-- FOOD TYPE -->
            <span class="food-type-badge" [class.veg]="item.type === 'veg'" [class.nonveg]="item.type === 'non-veg'"
              [attr.title]="
                item.type === 'veg'
                  ? 'Vegetarian'
                  : 'Non-Vegetarian'
              ">
              <span class="food-type-dot"></span>
            </span>

          </div>


          <!-- CARD CONTENT -->
          <div class="menu-info">

            <h4>
              {{ item.name }}
            </h4>

            <p *ngIf="!isMobile">
              {{ item.desc }}
            </p>

          </div>

        </article>

      </div>

    </div>

  </main>

</section>
