<div class="menu-container" id="menu">

  <!-- LEFT SIDEBAR -->
  <div class="menu-sidebar">

    <h3 class="menu-title">MENU</h3>

    <ul>
      <li *ngFor="let cat of categories" [class.active]="selectedCategory === cat" (click)="selectCategory(cat)">
        {{ cat }}
      </li>
    </ul>

  </div>


  <!-- RIGHT CONTENT -->
  <div class="menu-content">

    <h2>{{ selectedCategory }}</h2>

    <!-- VEG / NON-VEG FILTER -->
    <div class="food-type-filter">

      <button type="button" [class.active]="selectedFoodType === 'all'" (click)="selectFoodType('all')">
        All
      </button>

      <button type="button" [class.active]="selectedFoodType === 'veg'" (click)="selectFoodType('veg')">
        <span class="food-type-icon veg-icon"></span>
        Veg
      </button>

      <button type="button" [class.active]="selectedFoodType === 'non-veg'" (click)="selectFoodType('non-veg')">
        <span class="food-type-icon nonveg-icon"></span>
        Non-Veg
      </button>

    </div>


    <!-- BOOTSTRAP GRID -->
    <div class="row g-3">

      <div class="col-6 col-md-4 col-lg-2" *ngFor="let item of filteredItems">

        <div class="menu-card">

          <div class="menu-image-wrapper">

            <img [src]="item.image" [alt]="item.name" class="img-fluid" />

            <!-- FOOD TYPE ICON -->
            <span class="food-type-badge" [class.veg]="item.type === 'veg'" [class.nonveg]="item.type === 'non-veg'"
              [attr.title]="item.type === 'veg' ? 'Vegetarian' : 'Non-Vegetarian'">
              <span class="food-type-dot"></span>
            </span>

          </div>

          <div class="menu-info">

            <h4>{{ item.name }}</h4>

            <p *ngIf="!isMobile">
              {{ item.desc }}
            </p>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
